<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Review — Garmin Health Coach</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}" />
  <script src="{{ static_url('units.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    .r-wrap { max-width: 820px; margin: 0 auto; padding: 24px; padding-top: calc(var(--header-h,56px) + 20px); }
    .r-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap; }
    .r-head h2 { margin:0; font-size:20px; color:#2b2f36; }
    .r-gen { border:0; background:#2b2f36; color:#fff; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
    .r-gen[disabled] { opacity:.6; cursor:default; }
    .r-card { background:#fff; border:1px solid #ececf0; border-radius:12px; padding:20px 22px; margin-bottom:16px; }
    .r-week { font-size:16px; font-weight:700; color:#2b2f36; }
    .r-when { font-size:12px; color:#9aa0a8; margin-bottom:12px; }
    .r-stats { display:flex; flex-wrap:wrap; gap:14px 26px; margin:6px 0 14px; padding:12px 0; border-top:1px solid #f0f0f3; border-bottom:1px solid #f0f0f3; }
    .r-stat .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#9aa0a8; }
    .r-stat .v { font-size:15px; font-weight:700; color:#2b2f36; }
    .r-text { font-size:14px; line-height:1.6; color:#33373d; }
    .r-text p { margin:0 0 10px; }
    .r-empty { text-align:center; color:#8a8f98; padding:50px 20px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left"><span class="header-icon">📝</span><span class="header-title">Weekly Review</span></div>
    <div class="header-right">
      <a href="/" class="btn-ghost">💬 <span class="btn-text">Coach</span></a>
      <a href="/charts" class="btn-ghost">📈 <span class="btn-text">Charts</span></a>
      <a href="/analytics" class="btn-ghost">🔬 <span class="btn-text">Analytics</span></a>
      <a href="/activities" class="btn-ghost">📋 <span class="btn-text">Activities</span></a>
      <a href="/daily" class="btn-ghost">📅 <span class="btn-text">Daily</span></a>
      <a href="/plan" class="btn-ghost">🗺 <span class="btn-text">Plan</span></a>
      <a href="/goals" class="btn-ghost">🎯 <span class="btn-text">Goals</span></a>
      <a href="/settings" class="btn-ghost">⚙ <span class="btn-text">Settings</span></a>
    </div>
  </header>

  <div class="r-wrap">
    <div class="r-head">
      <h2>Weekly reviews</h2>
      <button class="r-gen" id="r-gen">✨ Generate this week's review</button>
    </div>
    <div id="r-list"><div class="r-empty">Loading…</div></div>
  </div>

  <script>
    const S = [
      ["activities","Activities"],["runs","Runs"],["run_km",null],
      ["active_minutes","Active min"],["avg_steps","Steps/day"],
      ["avg_resting_hr","Rest HR"],["avg_stress","Stress"],
      ["avg_sleep_hours","Sleep h"],["avg_sleep_score","Sleep score"],
      ["avg_readiness","Readiness"],
    ];
    function statBlock(st) {
      // run_km is stored canonically in km and converted for display.
      return '<div class="r-stats">' + S.filter(([k]) => st[k] != null).map(([k,lbl]) => {
        const isDist = k === "run_km";
        const label = isDist ? "Run " + Units.label() : lbl;
        const value = isDist ? Units.fromKm(st[k]).toFixed(1) : st[k];
        return '<div class="r-stat"><div class="k">'+label+'</div><div class="v">'+value+'</div></div>';
      }).join("") + '</div>';
    }
    function card(r) {
      return '<div class="r-card">'+
        '<div class="r-week">Week of '+r.week_start+' – '+r.week_end+'</div>'+
        '<div class="r-when">Generated '+new Date(r.generated_at).toLocaleString()+'</div>'+
        statBlock(r.stats||{})+
        '<div class="r-text">'+marked.parse(r.text||"")+'</div></div>';
    }
    async function load() {
      const { reviews } = await (await fetch("/api/weekly-review")).json();
      const list = document.getElementById("r-list");
      list.innerHTML = reviews.length ? reviews.map(card).join("")
        : '<div class="r-empty">No reviews yet. Generate your first weekly review above.</div>';
    }
    document.getElementById("r-gen").onclick = async () => {
      const b = document.getElementById("r-gen");
      b.disabled = true; b.textContent = "Generating… (asking your coach)";
      try {
        const res = await fetch("/api/weekly-review", { method:"POST" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "failed");
        await load();
      } catch (e) {
        alert("Could not generate review: " + e.message);
      } finally {
        b.disabled = false; b.textContent = "✨ Generate this week's review";
      }
    };
    Units.onChange(() => load());
    load();
  </script>
</body>
</html>
